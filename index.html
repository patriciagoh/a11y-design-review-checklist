<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a11y-design-review-checklist · audit</title>
<style>
  :root {
    --ink: #1a1a1f;
    --muted: #5b6271;
    --muted-2: #8a91a1;
    --line: #e4e6ea;
    --line-2: #eef0f3;
    --bg: #fafbfc;
    --card: #ffffff;
    --card-2: #f6f7f9;
    --accent: #4b56d2;
    --accent-soft: #eef0ff;
    --accent-ink: #2a35a8;
    --amber-bg: #fef3c7;
    --amber-ink: #78350f;
    --amber-line: #f3d894;
    --green-bg: #d1fae5;
    --green-ink: #065f46;
    --green-line: #9be3c4;
    --red-bg: #fee2e2;
    --red-ink: #991b1b;
    --red-line: #f5b6b6;
    --gray-bg: #eceef2;
    --gray-ink: #4b5363;
    --gray-line: #d6d9df;
    --code-bg: #0f1419;
    --code-ink: #d6e0ff;
    --shadow: 0 1px 2px rgba(15,20,25,0.04);
  }
  html[data-theme="dark"] {
    --ink: #e8eaf0;
    --muted: #9098a8;
    --muted-2: #6b7282;
    --line: #262932;
    --line-2: #1e2128;
    --bg: #0f1116;
    --card: #161922;
    --card-2: #1a1d27;
    --accent: #8b94f0;
    --accent-soft: #1d2140;
    --accent-ink: #b6bcff;
    --amber-bg: #3a2d10;
    --amber-ink: #fbd28a;
    --amber-line: #5a4519;
    --green-bg: #0f3326;
    --green-ink: #86e7bf;
    --green-line: #1a513a;
    --red-bg: #3a1717;
    --red-ink: #f5a3a3;
    --red-line: #5e2828;
    --gray-bg: #20232c;
    --gray-ink: #aab1c0;
    --gray-line: #2d313c;
    --code-bg: #050709;
    --code-ink: #c6d0ee;
    --shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  html[data-theme="dark"] { color-scheme: dark; }
  html[data-theme="light"] { color-scheme: light; }

  * { box-sizing: border-box; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    margin: 0;
    line-height: 1.55;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  code, .mono, kbd {
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }

  a { color: var(--accent); }

  /* ─── Layout ───────────────────────────────────────────── */

  .app {
    display: grid;
    grid-template-columns: 320px 1fr;
    min-height: 100vh;
  }
  aside.rail {
    border-right: 1px solid var(--line);
    background: var(--card);
    padding: 24px 20px 32px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  main.col {
    padding: 24px 28px 96px;
    max-width: 980px;
    width: 100%;
  }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    aside.rail {
      position: static;
      height: auto;
      border-right: none;
      border-bottom: 1px solid var(--line);
    }
  }

  /* ─── Header & app title ───────────────────────────────── */

  .app-title {
    margin: 0 0 4px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.2px;
  }
  .app-title .dot { color: var(--accent); }
  .app-tag {
    color: var(--muted);
    font-size: 12px;
    margin: 0 0 24px;
  }
  .theme-row {
    display: flex;
    gap: 4px;
    margin-top: 14px;
  }
  .theme-row button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 4px 8px;
    border-radius: 5px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
  }
  .theme-row button[aria-pressed="true"] {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
  }

  /* ─── Rail sections ────────────────────────────────────── */

  .rail-section { margin-bottom: 22px; }
  .rail-section h3 {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
    margin: 0 0 10px;
  }

  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    font-weight: 600;
  }
  .field input[type="text"], .field input[type="search"] {
    background: var(--card-2);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
  }
  .field input:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .field input.required-empty { border-color: var(--amber-line); }

  /* Mode radios — segmented look */
  .mode-radios { display: grid; gap: 4px; }
  .mode-radios label {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
    background: var(--card-2);
  }
  .mode-radios label:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .mode-radios input { margin-top: 3px; accent-color: var(--accent); }
  .mode-radios .m-label { font-size: 13px; font-weight: 500; }
  .mode-radios .m-help { font-size: 11px; color: var(--muted); display: block; margin-top: 1px; }

  /* Pills (filters) */
  .pills { display: flex; flex-wrap: wrap; gap: 4px; }
  .pill {
    font-size: 11.5px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--card-2);
    border: 1px solid var(--line);
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    font-family: inherit;
  }
  .pill[aria-pressed="true"] {
    background: var(--accent-soft);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .pill.quick { background: transparent; }
  .pill.quick[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
  }

  details.tags-more { margin-top: 6px; }
  details.tags-more summary {
    cursor: pointer;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    list-style: none;
    padding: 4px 0;
  }
  details.tags-more summary::-webkit-details-marker { display: none; }
  details.tags-more summary::before { content: "+ "; }
  details.tags-more[open] summary::before { content: "− "; }

  /* Level seg */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button {
    background: var(--card-2);
    color: var(--muted);
    border: none;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    border-right: 1px solid var(--line);
  }
  .seg button:last-child { border-right: none; }
  .seg button[aria-pressed="true"] {
    background: var(--accent-soft);
    color: var(--accent-ink);
    font-weight: 600;
  }

  /* Status filter pills */
  .status-pills { display: flex; flex-wrap: wrap; gap: 4px; }
  .status-pills .pill[data-s="pass"][aria-pressed="true"] {
    background: var(--green-bg); color: var(--green-ink); border-color: var(--green-line);
  }
  .status-pills .pill[data-s="fail"][aria-pressed="true"] {
    background: var(--red-bg); color: var(--red-ink); border-color: var(--red-line);
  }
  .status-pills .pill[data-s="na"][aria-pressed="true"] {
    background: var(--gray-bg); color: var(--gray-ink); border-color: var(--gray-line);
  }
  .status-pills .pill[data-s="needs_investigation"][aria-pressed="true"] {
    background: var(--amber-bg); color: var(--amber-ink); border-color: var(--amber-line);
  }

  /* ─── Summary block ─────────────────────────────────────── */

  .summary {
    background: var(--card-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .summary .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--muted); }
  .summary .row + .row { margin-top: 4px; }
  .summary .row strong { color: var(--ink); font-weight: 600; font-size: 13px; }
  .summary .coverage {
    margin: 10px 0 8px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
  }
  .bar {
    height: 8px;
    background: var(--line);
    border-radius: 4px;
    overflow: hidden;
    display: flex;
  }
  .bar > span { display: block; height: 100%; }
  .bar .b-pass { background: #10b981; }
  .bar .b-fail { background: #ef4444; }
  .bar .b-na   { background: var(--muted-2); }
  .bar .b-ni   { background: #f59e0b; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11px; color: var(--muted); margin-top: 8px; }
  .legend span::before {
    content: "";
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 2px;
    margin-right: 5px;
    vertical-align: middle;
  }
  .legend .l-pass::before { background: #10b981; }
  .legend .l-fail::before { background: #ef4444; }
  .legend .l-na::before   { background: var(--muted-2); }
  .legend .l-ni::before   { background: #f59e0b; }

  /* ─── Toolbar actions (export/import/reset) ────────────── */

  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .actions .btn {
    flex: 1 1 auto;
    min-width: 0;
  }
  .btn {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 7px 11px;
    border-radius: 6px;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    text-align: center;
  }
  .btn:hover:not(:disabled) { background: var(--card-2); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
  .btn.danger { color: var(--red-ink); }

  /* ─── Main column ──────────────────────────────────────── */

  .main-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 18px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .main-head h1 {
    font-size: 22px;
    margin: 0 0 2px;
    letter-spacing: -0.3px;
  }
  .main-head .sub {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }
  .count-chip {
    background: var(--card);
    border: 1px solid var(--line);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  .count-chip strong { color: var(--ink); }

  /* Item card */
  .item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 16px 18px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .item.has-pass { border-left: 3px solid #10b981; }
  .item.has-fail { border-left: 3px solid #ef4444; }
  .item.has-na   { border-left: 3px solid var(--muted-2); }
  .item.has-needs_investigation { border-left: 3px solid #f59e0b; }

  .item-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 10px;
    margin-bottom: 6px;
  }
  .item-head h2 {
    margin: 0;
    font-size: 15.5px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: -0.1px;
    flex: 1 1 100%;
  }
  .item-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    margin: 4px 0 10px;
    font-size: 11.5px;
  }
  .chip {
    display: inline-block;
    background: var(--card-2);
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 11px;
  }
  .chip.id { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 10.5px; }
  .chip.wcag { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-soft); }
  .chip.level { font-weight: 600; }
  .chip.surface { background: transparent; }

  .item-desc { margin: 0 0 12px; color: var(--ink); font-size: 14px; line-height: 1.55; }

  /* Status segmented control */
  .status-seg {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    margin-right: 8px;
    flex-wrap: wrap;
  }
  .status-seg button {
    background: var(--card-2);
    color: var(--muted);
    border: none;
    border-right: 1px solid var(--line);
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .status-seg button:last-child { border-right: none; }
  .status-seg button[aria-pressed="true"][data-s="pass"] {
    background: var(--green-bg); color: var(--green-ink); font-weight: 600;
  }
  .status-seg button[aria-pressed="true"][data-s="fail"] {
    background: var(--red-bg); color: var(--red-ink); font-weight: 600;
  }
  .status-seg button[aria-pressed="true"][data-s="na"] {
    background: var(--gray-bg); color: var(--gray-ink); font-weight: 600;
  }
  .status-seg button[aria-pressed="true"][data-s="needs_investigation"] {
    background: var(--amber-bg); color: var(--amber-ink); font-weight: 600;
  }

  .clear-link {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 11.5px;
    cursor: pointer;
    text-decoration: underline;
    font-family: inherit;
    padding: 0;
  }

  .item-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    margin-top: 6px;
  }

  .note-toggle {
    background: none;
    border: 1px dashed var(--line);
    color: var(--muted);
    padding: 4px 9px;
    border-radius: 5px;
    font-size: 11.5px;
    cursor: pointer;
    font-family: inherit;
  }
  .note-toggle.has-note { color: var(--accent); border-style: solid; border-color: var(--accent); background: var(--accent-soft); }

  .note-wrap { margin-top: 10px; }
  .note-wrap label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .note-wrap textarea {
    width: 100%;
    min-height: 60px;
    background: var(--card-2);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 8px 10px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13.5px;
    line-height: 1.45;
    resize: vertical;
  }

  details.disclose { margin-top: 10px; }
  details.disclose summary {
    cursor: pointer;
    font-size: 11.5px;
    color: var(--muted);
    list-style: none;
    padding: 4px 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  details.disclose summary::-webkit-details-marker { display: none; }
  details.disclose summary::before { content: "▸ "; color: var(--muted-2); }
  details.disclose[open] summary::before { content: "▾ "; }

  details.disclose .body {
    padding: 8px 0 4px;
    font-size: 13.5px;
  }
  details.disclose ul { margin: 4px 0 4px 18px; padding: 0; }
  details.disclose li { margin-bottom: 4px; }
  details.disclose a { color: var(--accent); }

  /* ─── States ───────────────────────────────────────────── */

  .state {
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: 9px;
    padding: 32px 22px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  .state .err {
    color: var(--red-ink);
    background: var(--red-bg);
    border-radius: 6px;
    padding: 8px 12px;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 12.5px;
    display: inline-block;
    margin: 8px 0 14px;
  }

  /* Hide visually but keep accessible */
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Audit controls and summary">
    <h1 class="app-title">a11y-design-review-checklist <span class="dot">·</span> audit</h1>
    <p class="app-tag" id="app-tag">Loading checklist…</p>

    <div class="rail-section">
      <h3>Context</h3>
      <div class="field">
        <label for="f-component">Component / feature</label>
        <input id="f-component" type="text" autocomplete="off" placeholder="e.g. annotation pin v2">
      </div>
      <div class="field">
        <label for="f-auditor">Auditor</label>
        <input id="f-auditor" type="text" autocomplete="off" placeholder="your name">
      </div>
    </div>

    <div class="rail-section">
      <h3>Mode</h3>
      <div class="mode-radios" role="radiogroup" aria-label="Audit mode">
        <label>
          <input type="radio" name="mode" value="pre-pr">
          <span><span class="m-label">Pre-PR self-audit</span>
          <span class="m-help">Pick a surface, run through it before shipping.</span></span>
        </label>
        <label>
          <input type="radio" name="mode" value="design-review">
          <span><span class="m-label">Design review</span>
          <span class="m-help">Collaborative session — notes are first-class.</span></span>
        </label>
        <label>
          <input type="radio" name="mode" value="full-audit" checked>
          <span><span class="m-label">Full audit</span>
          <span class="m-help">All 95 items, baseline coverage.</span></span>
        </label>
      </div>
    </div>

    <div class="rail-section">
      <h3>Search</h3>
      <div class="field">
        <input id="f-search" type="search" placeholder="Filter titles & descriptions…" autocomplete="off">
      </div>
    </div>

    <div class="rail-section">
      <h3>Surface</h3>
      <div class="pills" id="surface-pills" role="group" aria-label="Filter by surface"></div>
    </div>

    <div class="rail-section">
      <h3>Level</h3>
      <div class="seg" role="group" aria-label="Filter by WCAG level">
        <button type="button" data-level="all" aria-pressed="true">All</button>
        <button type="button" data-level="A" aria-pressed="false">A</button>
        <button type="button" data-level="AA" aria-pressed="false">AA</button>
      </div>
    </div>

    <div class="rail-section">
      <h3>Quick tags</h3>
      <div class="pills" id="quick-tags" role="group" aria-label="Quick tag filters"></div>
      <details class="tags-more">
        <summary>All tags</summary>
        <div class="pills" id="all-tags" role="group" aria-label="All tag filters" style="margin-top: 8px;"></div>
      </details>
    </div>

    <div class="rail-section">
      <h3>Status</h3>
      <div class="status-pills pills" id="status-pills" role="group" aria-label="Filter by status">
        <button type="button" class="pill" data-s="unmarked" aria-pressed="false">unmarked</button>
        <button type="button" class="pill" data-s="pass" aria-pressed="false">pass</button>
        <button type="button" class="pill" data-s="fail" aria-pressed="false">fail</button>
        <button type="button" class="pill" data-s="na" aria-pressed="false">n/a</button>
        <button type="button" class="pill" data-s="needs_investigation" aria-pressed="false">needs investigation</button>
      </div>
    </div>

    <div class="rail-section">
      <h3>Summary</h3>
      <div class="summary" id="summary">
        <div class="row"><span>Scoped</span><strong id="s-scoped">—</strong></div>
        <div class="row"><span>Pass</span><strong id="s-pass">0</strong></div>
        <div class="row"><span>Fail</span><strong id="s-fail">0</strong></div>
        <div class="row"><span>N/A</span><strong id="s-na">0</strong></div>
        <div class="row"><span>Needs investigation</span><strong id="s-ni">0</strong></div>
        <div class="coverage" id="s-coverage">Coverage 0%</div>
        <div class="bar" aria-hidden="true">
          <span class="b-pass" id="bar-pass" style="width:0%"></span>
          <span class="b-fail" id="bar-fail" style="width:0%"></span>
          <span class="b-na"   id="bar-na"   style="width:0%"></span>
          <span class="b-ni"   id="bar-ni"   style="width:0%"></span>
        </div>
        <div class="legend">
          <span class="l-pass">pass</span>
          <span class="l-fail">fail</span>
          <span class="l-na">n/a</span>
          <span class="l-ni">needs invest.</span>
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" id="btn-export" type="button">Export JSON</button>
        <button class="btn" id="btn-import" type="button">Import…</button>
        <input id="import-input" type="file" accept="application/json,.json" hidden>
        <button class="btn danger" id="btn-reset" type="button">Reset</button>
      </div>
    </div>

    <div class="rail-section">
      <h3>Theme</h3>
      <div class="theme-row" role="radiogroup" aria-label="Theme">
        <button type="button" data-theme="system" aria-pressed="true">System</button>
        <button type="button" data-theme="light" aria-pressed="false">Light</button>
        <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
      </div>
    </div>
  </aside>

  <main class="col">
    <div class="main-head">
      <div>
        <h1 id="main-h1">Full audit</h1>
        <p class="sub" id="main-sub">All items, no surface scope.</p>
      </div>
      <span class="count-chip" id="count-chip"><strong>0</strong> of 0 items</span>
    </div>

    <div id="items"></div>
  </main>
</div>

<script>
(function () {
  "use strict";

  // ─── Constants ───────────────────────────────────────────
  const SURFACES = [
    "3D model viewer",
    "Annotation pins & markups",
    "Discussion threads",
    "Review workflow & status",
    "Version history & comparison",
    "Issue tracking",
    "Notifications & live updates",
    "AI-generated content",
    "Notebooks & documents"
  ];

  const QUICK_TAGS = [
    "annotations", "threads", "versioning", "focus", "live-regions",
    "canvas", "status", "workflow", "ai-content", "toolbar", "realtime"
  ];

  const STATUS_LABELS = {
    pass: "Pass",
    fail: "Fail",
    na: "N/A",
    needs_investigation: "Needs investigation"
  };

  const MODE_HEADINGS = {
    "pre-pr": {
      h1: "Pre-PR self-audit",
      sub: "Pick the surface(s) for the component you're shipping, then walk through each item."
    },
    "design-review": {
      h1: "Design review session",
      sub: "Collaborative review — notes are first-class on every item."
    },
    "full-audit": {
      h1: "Full audit",
      sub: "All items, no surface scope. Use this for a comprehensive baseline."
    }
  };

  const LS_STATE_KEY = "a11y-checklist-state-v1";
  const LS_THEME_KEY = "a11y-checklist-theme-v1";
  const LS_MODE_KEY  = "a11y-checklist-mode-v1";
  const LS_CTX_KEY   = "a11y-checklist-ctx-v1";

  // ─── State ───────────────────────────────────────────────
  const state = {
    doc: null,                       // raw checklist.json
    items: [],                       // doc.items
    allTags: [],                     // computed
    marks: loadMarks(),              // { [id]: { status, note } }
    filters: {
      surfaces: new Set(),           // empty = all
      tags: new Set(),
      level: "all",                  // "all" | "A" | "AA"
      statuses: new Set(),           // subset of {unmarked, pass, fail, na, needs_investigation}
      search: ""
    },
    mode: loadMode(),
    ctx: loadCtx()
  };

  // ─── Persistence helpers ─────────────────────────────────
  function loadMarks() {
    try {
      const raw = localStorage.getItem(LS_STATE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveMarks() {
    try { localStorage.setItem(LS_STATE_KEY, JSON.stringify(state.marks)); }
    catch (e) { /* ignore quota */ }
  }
  function loadMode() {
    try { return localStorage.getItem(LS_MODE_KEY) || "full-audit"; }
    catch (e) { return "full-audit"; }
  }
  function saveMode() {
    try { localStorage.setItem(LS_MODE_KEY, state.mode); } catch (e) {}
  }
  function loadCtx() {
    try {
      const raw = localStorage.getItem(LS_CTX_KEY);
      return raw ? JSON.parse(raw) : { component: "", auditor: "" };
    } catch (e) { return { component: "", auditor: "" }; }
  }
  function saveCtx() {
    try { localStorage.setItem(LS_CTX_KEY, JSON.stringify(state.ctx)); } catch (e) {}
  }

  // ─── Theme ───────────────────────────────────────────────
  function applyTheme(pref) {
    const html = document.documentElement;
    if (pref === "system") {
      const dark = matchMedia("(prefers-color-scheme: dark)").matches;
      html.setAttribute("data-theme", dark ? "dark" : "light");
    } else {
      html.setAttribute("data-theme", pref);
    }
    document.querySelectorAll(".theme-row button").forEach(b => {
      b.setAttribute("aria-pressed", String(b.dataset.theme === pref));
    });
  }
  function initTheme() {
    let pref;
    try { pref = localStorage.getItem(LS_THEME_KEY) || "system"; }
    catch (e) { pref = "system"; }
    applyTheme(pref);
    document.querySelectorAll(".theme-row button").forEach(b => {
      b.addEventListener("click", () => {
        const p = b.dataset.theme;
        try { localStorage.setItem(LS_THEME_KEY, p); } catch (e) {}
        applyTheme(p);
      });
    });
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      let cur;
      try { cur = localStorage.getItem(LS_THEME_KEY) || "system"; }
      catch (e) { cur = "system"; }
      if (cur === "system") applyTheme("system");
    });
  }

  // ─── Fetch checklist ─────────────────────────────────────
  function loadChecklist() {
    const root = document.getElementById("items");
    root.innerHTML = '<div class="state">Loading checklist…</div>';
    fetch("./checklist.json", { cache: "no-store" })
      .then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status + " " + r.statusText);
        return r.json();
      })
      .then(data => {
        state.doc = data;
        state.items = Array.isArray(data.items) ? data.items : [];
        state.allTags = collectTags(state.items);
        document.getElementById("app-tag").textContent =
          "v" + (data.version || "?") + " · WCAG " + (data.wcag_version || "?") +
          " · " + state.items.length + " items";
        buildFilters();
        applyMode(state.mode, /*initial*/ true);
        applyCtxInputs();
        render();
      })
      .catch(err => {
        root.innerHTML =
          '<div class="state"><div>Could not load <code>checklist.json</code>.</div>' +
          '<div class="err">' + escapeHTML(err.message) + '</div>' +
          '<button class="btn" id="retry-btn" type="button">Retry</button></div>';
        const btn = document.getElementById("retry-btn");
        if (btn) btn.addEventListener("click", loadChecklist);
      });
  }

  function collectTags(items) {
    const s = new Set();
    items.forEach(it => (it.tags || []).forEach(t => s.add(t)));
    return Array.from(s).sort();
  }

  // ─── Build filter UIs (surfaces, tags) ───────────────────
  function buildFilters() {
    // Surface pills — use canonical SURFACES list, but show count in data
    const sCounts = {};
    state.items.forEach(i => { sCounts[i.surface] = (sCounts[i.surface] || 0) + 1; });
    const surfaceWrap = document.getElementById("surface-pills");
    surfaceWrap.innerHTML = "";
    SURFACES.forEach(name => {
      const c = sCounts[name] || 0;
      const b = document.createElement("button");
      b.type = "button";
      b.className = "pill";
      b.dataset.surface = name;
      b.setAttribute("aria-pressed", "false");
      b.textContent = name + (c ? " · " + c : " · 0");
      if (c === 0) b.style.opacity = "0.45";
      b.addEventListener("click", () => toggleSetFilter("surfaces", name, b));
      surfaceWrap.appendChild(b);
    });

    // Quick tags
    const quickWrap = document.getElementById("quick-tags");
    quickWrap.innerHTML = "";
    QUICK_TAGS.forEach(t => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "pill quick";
      b.dataset.tag = t;
      b.setAttribute("aria-pressed", "false");
      b.textContent = "#" + t;
      b.addEventListener("click", () => toggleTagFilter(t));
      quickWrap.appendChild(b);
    });

    // All tags (from data)
    const allWrap = document.getElementById("all-tags");
    allWrap.innerHTML = "";
    state.allTags.forEach(t => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "pill";
      b.dataset.tag = t;
      b.setAttribute("aria-pressed", "false");
      b.textContent = "#" + t;
      b.addEventListener("click", () => toggleTagFilter(t));
      allWrap.appendChild(b);
    });

    // Level seg
    document.querySelectorAll('.seg button[data-level]').forEach(b => {
      b.addEventListener("click", () => {
        state.filters.level = b.dataset.level;
        document.querySelectorAll('.seg button[data-level]').forEach(x => {
          x.setAttribute("aria-pressed", String(x.dataset.level === state.filters.level));
        });
        render();
      });
    });

    // Status pills
    document.querySelectorAll('#status-pills .pill').forEach(b => {
      b.addEventListener("click", () => {
        const s = b.dataset.s;
        if (state.filters.statuses.has(s)) state.filters.statuses.delete(s);
        else state.filters.statuses.add(s);
        b.setAttribute("aria-pressed", String(state.filters.statuses.has(s)));
        render();
      });
    });

    // Search
    const search = document.getElementById("f-search");
    let t;
    search.addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(() => {
        state.filters.search = search.value.trim().toLowerCase();
        render();
      }, 90);
    });

    // Mode radios
    document.querySelectorAll('input[name="mode"]').forEach(r => {
      r.addEventListener("change", () => {
        if (r.checked) applyMode(r.value);
      });
    });

    // Context inputs
    document.getElementById("f-component").addEventListener("input", e => {
      state.ctx.component = e.target.value;
      saveCtx();
      updateExportEnabled();
    });
    document.getElementById("f-auditor").addEventListener("input", e => {
      state.ctx.auditor = e.target.value;
      saveCtx();
      updateExportEnabled();
    });

    // Actions
    document.getElementById("btn-export").addEventListener("click", exportReport);
    document.getElementById("btn-import").addEventListener("click", () => {
      document.getElementById("import-input").click();
    });
    document.getElementById("import-input").addEventListener("change", importReport);
    document.getElementById("btn-reset").addEventListener("click", () => {
      if (!confirm("Clear all status marks and notes? This cannot be undone.")) return;
      state.marks = {};
      saveMarks();
      render();
    });
  }

  function toggleSetFilter(key, value, btn) {
    const set = state.filters[key];
    if (set.has(value)) set.delete(value);
    else set.add(value);
    btn.setAttribute("aria-pressed", String(set.has(value)));
    render();
  }

  function toggleTagFilter(tag) {
    const set = state.filters.tags;
    if (set.has(tag)) set.delete(tag);
    else set.add(tag);
    // sync any pill with this tag (quick + all)
    document.querySelectorAll('button.pill[data-tag="' + cssEscape(tag) + '"]').forEach(b => {
      b.setAttribute("aria-pressed", String(set.has(tag)));
    });
    render();
  }

  function applyMode(mode, initial) {
    state.mode = mode;
    saveMode();
    document.querySelectorAll('input[name="mode"]').forEach(r => {
      r.checked = (r.value === mode);
    });
    const h = MODE_HEADINGS[mode];
    document.getElementById("main-h1").textContent = h.h1;
    document.getElementById("main-sub").textContent = h.sub;
    if (!initial) render();
  }

  function applyCtxInputs() {
    document.getElementById("f-component").value = state.ctx.component || "";
    document.getElementById("f-auditor").value = state.ctx.auditor || "";
    updateExportEnabled();
  }

  function updateExportEnabled() {
    const btn = document.getElementById("btn-export");
    const ok = (state.ctx.component || "").trim() && (state.ctx.auditor || "").trim();
    btn.disabled = !ok;
    btn.title = ok ? "Download audit report" : "Fill component & auditor to export";
    document.getElementById("f-component").classList.toggle("required-empty", !(state.ctx.component || "").trim());
    document.getElementById("f-auditor").classList.toggle("required-empty", !(state.ctx.auditor || "").trim());
  }

  // ─── Filtering ───────────────────────────────────────────
  function getScopedItems() {
    const f = state.filters;
    return state.items.filter(it => {
      if (f.surfaces.size && !f.surfaces.has(it.surface)) return false;
      if (f.level !== "all" && it.level !== f.level) return false;
      if (f.tags.size) {
        const itags = it.tags || [];
        let any = false;
        for (const t of f.tags) { if (itags.includes(t)) { any = true; break; } }
        if (!any) return false;
      }
      if (f.statuses.size) {
        const mark = state.marks[it.id];
        const s = mark && mark.status ? mark.status : "unmarked";
        if (!f.statuses.has(s)) return false;
      }
      if (f.search) {
        const blob = (it.title + " " + it.description + " " + it.id + " " +
                      (it.wcag_criterion || "") + " " + (it.wcag_title || "")).toLowerCase();
        if (blob.indexOf(f.search) === -1) return false;
      }
      return true;
    });
  }

  // ─── Render ──────────────────────────────────────────────
  function render() {
    const scoped = getScopedItems();
    const root = document.getElementById("items");

    // Count chip
    document.getElementById("count-chip").innerHTML =
      "<strong>" + scoped.length + "</strong> of " + state.items.length + " items";

    // Summary
    updateSummary(scoped);

    if (!scoped.length) {
      root.innerHTML =
        '<div class="state"><div>No items match these filters.</div>' +
        '<div style="margin-top: 14px;"><button class="btn" id="clear-filters-btn" type="button">Clear all filters</button></div></div>';
      document.getElementById("clear-filters-btn").addEventListener("click", clearAllFilters);
      return;
    }

    // Build via DocumentFragment for perf
    const frag = document.createDocumentFragment();
    scoped.forEach(it => frag.appendChild(renderItem(it)));
    root.innerHTML = "";
    root.appendChild(frag);
  }

  function clearAllFilters() {
    state.filters.surfaces.clear();
    state.filters.tags.clear();
    state.filters.statuses.clear();
    state.filters.level = "all";
    state.filters.search = "";
    document.querySelectorAll('#surface-pills .pill, #quick-tags .pill, #all-tags .pill, #status-pills .pill')
      .forEach(b => b.setAttribute("aria-pressed", "false"));
    document.querySelectorAll('.seg button[data-level]').forEach(b => {
      b.setAttribute("aria-pressed", String(b.dataset.level === "all"));
    });
    document.getElementById("f-search").value = "";
    render();
  }

  function renderItem(it) {
    const mark = state.marks[it.id] || { status: null, note: "" };
    const card = document.createElement("article");
    card.className = "item" + (mark.status ? " has-" + mark.status : "");
    card.dataset.id = it.id;

    const head = document.createElement("header");
    head.className = "item-head";
    const h2 = document.createElement("h2");
    h2.textContent = it.title;
    head.appendChild(h2);
    card.appendChild(head);

    const meta = document.createElement("div");
    meta.className = "item-meta";
    meta.appendChild(makeChip("id", it.id, "id"));
    meta.appendChild(makeChip("wcag", it.wcag_criterion + " " + it.wcag_title, "wcag"));
    meta.appendChild(makeChip("level", "Level " + it.level, "level"));
    meta.appendChild(makeChip("surface", it.surface, "surface"));
    (it.tags || []).forEach(t => meta.appendChild(makeChip("tag", "#" + t)));
    card.appendChild(meta);

    const desc = document.createElement("p");
    desc.className = "item-desc";
    desc.textContent = it.description || "";
    card.appendChild(desc);

    // Controls row: status seg + clear + note toggle (when collapsed)
    const controls = document.createElement("div");
    controls.className = "item-controls";

    const seg = document.createElement("div");
    seg.className = "status-seg";
    seg.setAttribute("role", "group");
    seg.setAttribute("aria-label", "Status for " + it.id);
    ["pass", "fail", "na", "needs_investigation"].forEach(s => {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.s = s;
      b.textContent = STATUS_LABELS[s];
      b.setAttribute("aria-pressed", String(mark.status === s));
      b.addEventListener("click", () => setStatus(it.id, s));
      seg.appendChild(b);
    });
    controls.appendChild(seg);

    if (mark.status) {
      const clr = document.createElement("button");
      clr.type = "button";
      clr.className = "clear-link";
      clr.textContent = "clear";
      clr.addEventListener("click", () => setStatus(it.id, null));
      controls.appendChild(clr);
    }

    const noteShown = state.mode === "design-review" || !!mark.note;
    if (!noteShown) {
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "note-toggle";
      toggle.textContent = "+ Add note";
      toggle.addEventListener("click", () => {
        // expand the note area for this item
        const ta = card.querySelector("textarea[data-note]");
        if (ta) { ta.focus(); return; }
        const w = renderNoteArea(it, mark, /*forceShow*/ true);
        card.appendChild(w);
        toggle.remove();
        w.querySelector("textarea").focus();
      });
      controls.appendChild(toggle);
    }
    card.appendChild(controls);

    if (noteShown) {
      card.appendChild(renderNoteArea(it, mark));
    }

    // Disclosures
    if (it.how_to_test && it.how_to_test.length)
      card.appendChild(renderDisclosure("How to test", it.how_to_test, "ul"));
    if (it.pass_criteria && it.pass_criteria.length)
      card.appendChild(renderDisclosure("Pass criteria", it.pass_criteria, "ul"));
    if (it.fail_examples && it.fail_examples.length)
      card.appendChild(renderDisclosure("Fail examples", it.fail_examples, "ul"));
    if (it.references && it.references.length)
      card.appendChild(renderReferences(it.references));

    return card;
  }

  function renderNoteArea(it, mark, forceShow) {
    const wrap = document.createElement("div");
    wrap.className = "note-wrap";
    const id = "note-" + cssId(it.id);
    const lab = document.createElement("label");
    lab.htmlFor = id;
    lab.textContent = "Notes";
    const ta = document.createElement("textarea");
    ta.id = id;
    ta.dataset.note = "1";
    ta.value = mark.note || "";
    ta.placeholder = state.mode === "design-review"
      ? "Discussion notes, decisions, follow-ups…"
      : "Optional notes about this item…";
    let to;
    ta.addEventListener("input", () => {
      clearTimeout(to);
      to = setTimeout(() => setNote(it.id, ta.value), 180);
    });
    wrap.appendChild(lab);
    wrap.appendChild(ta);
    return wrap;
  }

  function renderDisclosure(label, list, _kind) {
    const d = document.createElement("details");
    d.className = "disclose";
    const s = document.createElement("summary");
    s.textContent = label;
    d.appendChild(s);
    const body = document.createElement("div");
    body.className = "body";
    const ul = document.createElement("ul");
    list.forEach(x => {
      const li = document.createElement("li");
      li.textContent = x;
      ul.appendChild(li);
    });
    body.appendChild(ul);
    d.appendChild(body);
    return d;
  }

  function renderReferences(refs) {
    const d = document.createElement("details");
    d.className = "disclose";
    const s = document.createElement("summary");
    s.textContent = "References";
    d.appendChild(s);
    const body = document.createElement("div");
    body.className = "body";
    const ul = document.createElement("ul");
    refs.forEach(r => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = r.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = r.label || r.url;
      li.appendChild(a);
      ul.appendChild(li);
    });
    body.appendChild(ul);
    d.appendChild(body);
    return d;
  }

  function makeChip(_kind, text, extraCls) {
    const span = document.createElement("span");
    span.className = "chip" + (extraCls ? " " + extraCls : "");
    span.textContent = text;
    return span;
  }

  // ─── Mutations ───────────────────────────────────────────
  function setStatus(id, status) {
    const cur = state.marks[id] || { status: null, note: "" };
    cur.status = status;
    if (!status && !cur.note) delete state.marks[id];
    else state.marks[id] = cur;
    saveMarks();
    // Re-render just the card for snappiness
    rerenderItem(id);
    // But summary needs whole rescope
    updateSummary(getScopedItems());
  }

  function setNote(id, note) {
    const cur = state.marks[id] || { status: null, note: "" };
    cur.note = note;
    if (!note && !cur.status) delete state.marks[id];
    else state.marks[id] = cur;
    saveMarks();
    // Don't rerender — would steal textarea focus. Just update card border subtly.
    const card = document.querySelector('.item[data-id="' + cssEscape(id) + '"]');
    if (card) {
      const toggle = card.querySelector(".note-toggle");
      if (toggle && note) toggle.classList.add("has-note");
    }
  }

  function rerenderItem(id) {
    const it = state.items.find(x => x.id === id);
    if (!it) return;
    const old = document.querySelector('.item[data-id="' + cssEscape(id) + '"]');
    if (!old) return;
    const fresh = renderItem(it);
    old.replaceWith(fresh);
  }

  // ─── Summary ─────────────────────────────────────────────
  function updateSummary(scoped) {
    let pass = 0, fail = 0, na = 0, ni = 0;
    scoped.forEach(it => {
      const m = state.marks[it.id];
      if (!m || !m.status) return;
      if (m.status === "pass") pass++;
      else if (m.status === "fail") fail++;
      else if (m.status === "na") na++;
      else if (m.status === "needs_investigation") ni++;
    });
    const marked = pass + fail + na + ni;
    const total = scoped.length;
    document.getElementById("s-scoped").textContent = total + " / " + state.items.length;
    document.getElementById("s-pass").textContent = pass;
    document.getElementById("s-fail").textContent = fail;
    document.getElementById("s-na").textContent = na;
    document.getElementById("s-ni").textContent = ni;
    const cov = total ? Math.round((marked / total) * 100) : 0;
    document.getElementById("s-coverage").textContent = "Coverage " + cov + "% (" + marked + "/" + total + " marked)";
    function pct(n) { return total ? ((n / total) * 100).toFixed(2) + "%" : "0%"; }
    document.getElementById("bar-pass").style.width = pct(pass);
    document.getElementById("bar-fail").style.width = pct(fail);
    document.getElementById("bar-na").style.width   = pct(na);
    document.getElementById("bar-ni").style.width   = pct(ni);
  }

  // ─── Export ──────────────────────────────────────────────
  function exportReport() {
    if (!state.ctx.component || !state.ctx.auditor) {
      alert("Component and Auditor are required for export.");
      return;
    }
    const scoped = getScopedItems();
    const surfaces = Array.from(state.filters.surfaces);
    const surfaceField = surfaces.length ? surfaces.join(", ") : "(all)";
    const today = new Date().toISOString().slice(0, 10);

    const results = [];
    state.items.forEach(it => {
      const m = state.marks[it.id];
      if (!m) return;
      if (!m.status && !(m.note && m.note.trim())) return;
      results.push({
        id: it.id,
        status: m.status || null,
        note: m.note || ""
      });
    });

    // Summary scoped to current filter
    const summary = {
      total: state.items.length,
      scoped: scoped.length,
      pass: 0, fail: 0, na: 0, needs_investigation: 0,
      by_surface: {}
    };
    scoped.forEach(it => {
      const m = state.marks[it.id];
      if (!m || !m.status) return;
      summary[m.status] = (summary[m.status] || 0) + 1;
      const bs = summary.by_surface[it.surface] || { pass: 0, fail: 0, na: 0, needs_investigation: 0 };
      bs[m.status] = (bs[m.status] || 0) + 1;
      summary.by_surface[it.surface] = bs;
    });

    const report = {
      meta: {
        component: state.ctx.component,
        surface: surfaceField,
        auditor: state.ctx.auditor,
        date: today,
        mode: state.mode,
        checklist_version: (state.doc && state.doc.version) || null
      },
      results: results,
      summary: summary
    };

    const blob = new Blob([JSON.stringify(report, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "audit-" + slug(state.ctx.component) + "-" + today + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  // ─── Import ──────────────────────────────────────────────
  function importReport(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.results)) throw new Error("Expected results[] in JSON.");
        if (!confirm("Importing will overwrite any current marks/notes for items in the file. Continue?")) {
          e.target.value = "";
          return;
        }
        // Merge: import overrides existing items in the file; leaves untouched items alone
        data.results.forEach(r => {
          if (!r || !r.id) return;
          state.marks[r.id] = {
            status: r.status || null,
            note: r.note || ""
          };
          // Prune empty
          if (!state.marks[r.id].status && !state.marks[r.id].note) delete state.marks[r.id];
        });
        if (data.meta) {
          if (typeof data.meta.component === "string") {
            state.ctx.component = data.meta.component;
          }
          if (typeof data.meta.auditor === "string") {
            state.ctx.auditor = data.meta.auditor;
          }
          if (typeof data.meta.mode === "string" && MODE_HEADINGS[data.meta.mode]) {
            applyMode(data.meta.mode);
          }
          saveCtx();
          applyCtxInputs();
        }
        saveMarks();
        render();
      } catch (err) {
        alert("Import failed: " + err.message);
      } finally {
        e.target.value = "";
      }
    };
    reader.readAsText(file);
  }

  // ─── Utility ─────────────────────────────────────────────
  function slug(s) {
    return (s || "audit").toString().toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .slice(0, 64) || "audit";
  }
  function cssEscape(s) {
    if (window.CSS && CSS.escape) return CSS.escape(s);
    return String(s).replace(/["\\]/g, "\\$&");
  }
  function cssId(s) {
    return String(s).replace(/[^a-zA-Z0-9_-]/g, "_");
  }
  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // ─── Boot ────────────────────────────────────────────────
  initTheme();
  loadChecklist();
})();
</script>
